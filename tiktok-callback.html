<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization — StreamClips Pipeline</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 80px auto;
    padding: 0 24px;
    color: #1a1a1a;
    line-height: 1.6;
  }
  h1 { font-size: 1.4rem; }
  code {
    display: block;
    background: #f3f3f3;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    word-break: break-all;
    margin: 16px 0;
  }
  button {
    background: #0b5fff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #094ecf; }
  .muted { color: #666; font-size: 0.9rem; }
  .warn { color: #b00; }
</style>
</head>
<body>
  <h1>TikTok Authorization</h1>
  <p class="muted">This page only displays the authorization code TikTok sent back. It does not store, log, or transmit it anywhere — copy it and paste it into the pipeline's local auth script.</p>

  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const errorDescription = params.get("error_description");
    const resultEl = document.getElementById("result");

    if (code) {
      resultEl.innerHTML = `
        <p><strong>Authorization code:</strong></p>
        <code id="code">${code}</code>
        <button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy to clipboard</button>
        <p class="muted">This code is single-use and expires quickly. Paste it into the pipeline's terminal prompt right away.</p>
      `;
    } else if (error) {
      resultEl.innerHTML = `
        <p class="warn"><strong>Authorization failed:</strong> ${error}</p>
        <p class="muted">${errorDescription || ""}</p>
      `;
    } else {
      resultEl.innerHTML = `<p class="muted">No authorization code in the URL. Did you land here directly instead of via TikTok's login flow?</p>`;
    }
  </script>
</body>
</html>
